<svg xmlns="http://www.w3.org/2000/svg" width="920" height="800" viewBox="0 0 920 800" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328">
  <title>Sơ đồ use case: Hệ thống quản lý chứng chỉ số Cipher Cert</title>
  <defs>
    <marker id="mui-ten" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0 L10 5 L0 10" fill="none" stroke="#1f2328" stroke-width="1.4"/>
    </marker>
  </defs>
  <!-- Nền trắng để đọc được cả khi GitHub ở giao diện tối. -->
  <rect width="920" height="800" fill="#ffffff"/>

  <!-- Khung hệ thống -->
  <rect x="222" y="20" width="530" height="760" fill="none" stroke="#1f2328" stroke-width="1.4"/>
  <text x="236" y="45" font-weight="700" font-size="14">Hệ thống Cipher Cert</text>

  <!-- Tác nhân: Nhân viên quản trị -->
  <g stroke="#1f2328" stroke-width="1.6" fill="none">
    <circle cx="90" cy="270" r="12"/>
    <line x1="90" y1="282" x2="90" y2="315"/>
    <line x1="70" y1="294" x2="110" y2="294"/>
    <line x1="90" y1="315" x2="74" y2="342"/>
    <line x1="90" y1="315" x2="106" y2="342"/>
  </g>
  <text x="90" y="248" text-anchor="middle" font-weight="600">Nhân viên quản trị</text>

  <!-- Tác nhân: Admin -->
  <g stroke="#1f2328" stroke-width="1.6" fill="none">
    <circle cx="90" cy="640" r="12"/>
    <line x1="90" y1="652" x2="90" y2="685"/>
    <line x1="70" y1="664" x2="110" y2="664"/>
    <line x1="90" y1="685" x2="74" y2="712"/>
    <line x1="90" y1="685" x2="106" y2="712"/>
  </g>
  <text x="90" y="732" text-anchor="middle" font-weight="600">Admin</text>

  <!-- Kế thừa: Admin làm được mọi việc của Nhân viên quản trị (mũi tam giác rỗng chỉ về Nhân viên) -->
  <line x1="90" y1="626" x2="90" y2="366" stroke="#1f2328" stroke-width="1.4"/>
  <path d="M90 350 L81 366 L99 366 Z" fill="#ffffff" stroke="#1f2328" stroke-width="1.4"/>

  <!-- Tác nhân phụ: máy chủ được đọc chứng chỉ -->
  <g stroke="#1f2328" stroke-width="1.6" fill="none">
    <circle cx="845" cy="315" r="12"/>
    <line x1="845" y1="327" x2="845" y2="360"/>
    <line x1="825" y1="339" x2="865" y2="339"/>
    <line x1="845" y1="360" x2="829" y2="387"/>
    <line x1="845" y1="360" x2="861" y2="387"/>
  </g>
  <text x="845" y="407" text-anchor="middle" font-weight="600">Máy chủ</text>
  <text x="845" y="423" text-anchor="middle" font-weight="600">bên ngoài</text>

  <!-- Liên kết tác nhân – use case -->
  <g stroke="#1f2328" stroke-width="1.1">
    <line x1="112" y1="300" x2="260" y2="100"/>
    <line x1="112" y1="300" x2="260" y2="150"/>
    <line x1="112" y1="300" x2="260" y2="200"/>
    <line x1="112" y1="300" x2="260" y2="250"/>
    <line x1="112" y1="300" x2="260" y2="300"/>
    <line x1="112" y1="300" x2="260" y2="350"/>
    <line x1="112" y1="300" x2="260" y2="400"/>
    <line x1="112" y1="300" x2="260" y2="450"/>
    <line x1="112" y1="300" x2="260" y2="500"/>
    <line x1="112" y1="300" x2="260" y2="550"/>
    <line x1="112" y1="670" x2="260" y2="630"/>
    <line x1="112" y1="670" x2="260" y2="680"/>
    <line x1="112" y1="670" x2="260" y2="730"/>
    <line x1="823" y1="350" x2="730" y2="350"/>
  </g>

  <!-- Use case -->
  <g fill="#f6f8fa" stroke="#1f2328" stroke-width="1.3">
    <ellipse cx="375" cy="100" rx="115" ry="21"/>
    <ellipse cx="375" cy="150" rx="115" ry="21"/>
    <ellipse cx="375" cy="200" rx="115" ry="21"/>
    <ellipse cx="375" cy="250" rx="115" ry="21"/>
    <ellipse cx="375" cy="300" rx="115" ry="21"/>
    <ellipse cx="375" cy="350" rx="115" ry="21"/>
    <ellipse cx="375" cy="400" rx="115" ry="21"/>
    <ellipse cx="375" cy="450" rx="115" ry="21"/>
    <ellipse cx="375" cy="500" rx="115" ry="21"/>
    <ellipse cx="375" cy="550" rx="115" ry="21"/>
    <ellipse cx="375" cy="630" rx="115" ry="21"/>
    <ellipse cx="375" cy="680" rx="115" ry="21"/>
    <ellipse cx="375" cy="730" rx="115" ry="21"/>
    <ellipse cx="640" cy="225" rx="90" ry="21"/>
    <ellipse cx="640" cy="350" rx="90" ry="21"/>
  </g>
  <g text-anchor="middle">
    <text x="375" y="105">UC01 · Đăng nhập, đăng xuất</text>
    <text x="375" y="155">UC02 · Quản lý tài khoản cá nhân</text>
    <text x="375" y="205">UC03 · Xem Dashboard</text>
    <text x="375" y="255">UC09 · Xem, xử lý cảnh báo</text>
    <text x="375" y="305">UC04 · Xem, tìm, lọc chứng chỉ</text>
    <text x="375" y="355">UC05 · Thêm, sửa chứng chỉ</text>
    <text x="375" y="405">UC06 · Thu hồi chứng chỉ</text>
    <text x="375" y="455">UC07 · Gia hạn, xem lịch sử</text>
    <text x="375" y="505">UC08 · Quản lý danh mục</text>
    <text x="375" y="555">UC10 · Thống kê, xuất báo cáo</text>
    <text x="375" y="635">UC11 · Xoá chứng chỉ</text>
    <text x="375" y="685">UC12 · Quản lý người dùng</text>
    <text x="375" y="735">UC13 · Xem nhật ký hoạt động</text>
    <text x="640" y="230">Tạo cảnh báo theo mốc</text>
    <text x="640" y="355">Đọc chứng chỉ từ máy chủ</text>
  </g>

  <!-- include: mở Dashboard hoặc Cảnh báo luôn chạy việc tạo cảnh báo; extend: đọc chứng chỉ là tuỳ chọn khi thêm -->
  <g stroke="#1f2328" stroke-width="1.1" stroke-dasharray="5 4" fill="none" marker-end="url(#mui-ten)">
    <line x1="490" y1="203" x2="553" y2="216"/>
    <line x1="490" y1="247" x2="553" y2="234"/>
    <line x1="550" y1="350" x2="492" y2="350"/>
  </g>
  <g font-size="11" fill="#57606a" text-anchor="middle">
    <text x="521" y="197">«include»</text>
    <text x="521" y="262">«include»</text>
    <text x="521" y="342">«extend»</text>
  </g>

  <!-- Chú thích ký hiệu -->
  <g font-size="11" fill="#57606a">
    <text x="236" y="772">Admin kế thừa Nhân viên quản trị: làm được mọi use case của Nhân viên, thêm UC11–UC13.</text>
  </g>
</svg>
