# Khối của web quản lý chứng chỉ, nối vào cuối /etc/caddy/Caddyfile chung (QD-07, QD-19).
# Bản gốc nằm trong repo: chạy lại dungmoi.sh của slushai sẽ ghi đè Caddyfile và làm mất khối này,
# khi đó chạy lại bước `caddy` trong deploy/dung_vps.sh.
# Không thêm http_port, https_port ở đây: hai dòng đó ở đầu Caddyfile đang giữ Caddy tránh cổng 443.
#
# 🔴 Xray giữ 443 và chuyển người lạ vào khối này (dest = 127.0.0.1:8443, QD-08). Mất khối này hay
# Caddy chết thì không chỉ mất web mà VPN cũng không nhận được kết nối mới.
# Khối này chỉ được nối một lần, nên sửa ở đây xong phải sửa cả trên VPS, bước `caddy` không tự cập nhật.

cert.cipher.id.vn {
	# Xin chứng chỉ qua cổng 80. Đường TLS-ALPN đi qua cổng 443 là chỗ của xray nên phải tắt.
	tls {
		issuer acme {
			disable_tlsalpn_challenge
		}
	}

	# Chỉ phục vụ thư mục public/: src/, config/, database/, tests/ không mở được từ web.
	root * /var/www/cipher/public
	encode gzip

	header {
		X-Content-Type-Options nosniff
		X-Frame-Options DENY
		Referrer-Policy same-origin
		-Server
		# Caddy tự quảng bá cổng thật của nó (h3=":8443"); xoá để trang ở 443 không lộ đuôi này.
		-Alt-Svc
	}

	# Link cũ kèm :8443 đá về địa chỉ không đuôi. Khách qua Xray có Host không kèm cổng nên không dính dòng này.
	@duoi_cu header Host cert.cipher.id.vn:8443
	redir @duoi_cu https://cert.cipher.id.vn{uri} permanent

	php_fastcgi unix//run/php/cipher.sock {
		# Địa chỉ không tồn tại trả về 404, thay vì mặc định chạy index.php (landing).
		try_files {path} {path}/index.php =404
	}
	file_server
}

# Viết rõ thay vì để Caddy tự đá: Caddy sẽ đá sang https_port của nó, tức là 8443.
http://cert.cipher.id.vn {
	redir https://cert.cipher.id.vn{uri} permanent
}
